name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: lint, types, and the unit/integration suite. Keeps `main` green.
  check:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-test-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # End-to-end golden path against the real Docker stack (#32).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the stack
        env:
          BETTER_AUTH_SECRET: ci-test-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          SIM_SERVICE_TOKEN: ci-test-sim-service-token
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build -d
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000/login; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "app did not become ready"; docker compose logs app; exit 1
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

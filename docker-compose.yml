# Patient Flow Orchestrator — local stack
#
#   docker compose up --build                  # hosted Claude (default)
#   docker compose --profile local up --build  # local models via Ollama
#
services:
  # Next.js app: UI + loop driver + in-process simulator + eval harness
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # The app port is deliberately NOT published to the host. Ingress is a
    # Cloudflare Tunnel (cloudflared) that dials outbound and reaches the origin
    # over the compose network, so the origin is never directly routable and
    # CF-Connecting-IP can be trusted for sign-in rate-limit keying.
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - OPENCODE_URL=http://opencode:4096
      - SIM_URL=http://localhost:3000/api/sim
      # Shared secret the agent's tools present to reach the (now auth-gated) sim
      # API server-to-server; scoped to /api/sim/* by the route guard.
      - SIM_SERVICE_TOKEN=${SIM_SERVICE_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SCENARIO=${SCENARIO:-normal-weekday}
      - SEED=${SEED:-42}
      # Auth (Better Auth + SQLite/Drizzle). The DB lives on the auth-data volume
      # so accounts + sessions survive a container restart.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - AUTH_DB_PATH=/data/auth.db
    volumes:
      - auth-data:/data
    # First-boot wiring: apply migrations and run the idempotent seed (no-op on
    # re-runs), then start the dev server. Keeps accounts available without a
    # manual seed step after a fresh volume.
    command: >
      sh -c "npx drizzle-kit migrate && npm run seed:auth &&
             npm run dev -- --hostname 0.0.0.0"
    depends_on:
      opencode:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json

  # OpenCode agent harness, headless (pinned image — see opencode.Dockerfile)
  opencode:
    build:
      context: .
      dockerfile: opencode.Dockerfile
    ports:
      - "4096:4096"
    environment:
      # Provider credentials — set a key and that provider's models become selectable
      # in Settings (OpenCode lists env-keyed providers via config.providers, #75). Zen
      # is the zero-config default (public key); these are opt-in.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_URL=http://ollama:11434
      - SIM_URL=http://app:3000/api/sim
      # Same shared secret as the app — the agent's tools send it to reach the sim.
      - SIM_SERVICE_TOKEN=${SIM_SERVICE_TOKEN:-}
      # Server binds 0.0.0.0 — protect it with HTTP basic auth.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      - ./.opencode:/workspace/.opencode:ro
      - ./opencode.json:/workspace/opencode.json:ro

  # Optional local model provider — enabled with: --profile local
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
  # SQLite auth store (accounts + sessions) — persists across container restarts.
  auth-data:
